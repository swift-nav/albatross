name: CI

on:
  pull_request:
  push:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  ubuntu-gcc11:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - name: Install gcc-11
        run: |
          sudo apt-get update
          sudo apt-get install build-essential software-properties-common libsuitesparse-dev -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install gcc-11 g++-11 -y
          gcc -v
      - name: Run build
        env:
          CC: gcc-11
          CXX: g++-11
          TESTENV: gcc11
          GCCVER: "11"
        run: |
          bash ./ci/run_tests.sh
          bash ./ci/ensure_copyright.sh

  ubuntu-clang14:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - name: Install clang-14
        run: |
          sudo apt-get update
          sudo apt-get install build-essential software-properties-common libsuitesparse-dev -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install clang-14 -y
          gcc -v
      - name: Run build
        env:
          CC: clang-14
          CXX: clang++-14
          TESTENV: clang14
        run: |
          bash ./ci/run_tests.sh
          bash ./ci/ensure_copyright.sh

  bazel-sanitizers:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizer:
          - { name: "address-undefined", config: "asan_ubsan" }
          - { name: "thread", config: "tsan" }
          # Memory sanitizer is not run because it requires building a
          # custom instrumented libc.
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68 # v3.0.0
        with:
          machine: raw.githubusercontent.com
          username: ${{ secrets.GH_NAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Mount bazel cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/bazel"
          key: bazel-${{ matrix.sanitizer.config }}

      - name: Run (${{ matrix.sanitizer.name }}) sanitizer tests
        run: bazel test --config=${{ matrix.sanitizer.config }} //...

  format-and-lint:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68 # v3.0.0
        with:
          machine: raw.githubusercontent.com
          username: ${{ secrets.GH_NAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Format
        run: bazel run //tools/format:format.check 

      - name: Lint
        shell: bash
        run: |
          ./scripts/lint.sh --targets //... || true
          cat ./clang-tidy-output/merged-report.sarif

  bazel:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - uses: extractions/netrc@c3879108aae6b4ed5c4eb60854ae04f06d2f2f68 # v3.0.0
        with:
          machine: raw.githubusercontent.com
          username: ${{ secrets.GH_NAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Mount bazel cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/bazel"
          key: bazel

      - name: Build and test
        run: bazel test //...

  osx-clang:
    runs-on: macOS-14
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - name: check clang
        run: |
          clang --version
      - name: install suite-sparse
        run: |
          brew install suite-sparse
      - name: Run build
        env:
          CC: clang
          CXX: clang++
          TESTENV: clang
        run: |
          bash ./ci/run_tests.sh

  ubuntu-build-documentation:
    runs-on: "ubuntu-22.04"
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-update-conda: true
          auto-activate-base: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
          persist-credentials: false

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install build-essential software-properties-common -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          
      - name: Build Docs
        run: |
          conda env create --file ./ci/albatross_docs_environment.yml
          conda activate albatross
          cd doc
          make html
  
